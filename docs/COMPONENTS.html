<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MIH PHCIS — Components Catalog</title>
<style>
  :root {
    --brand: #007549;
    --brand-100: #F4FBF8;
    --brand-200: #DDF0E6;
    --brand-700: #00563A;
    --ink: #1F2937;
    --ink-2: #4D5358;
    --ink-3: #6B7177;
    --ink-4: #ADB2B7;
    --border: #E2E4E6;
    --surface: #FFFFFF;
    --bg: #F7F9FA;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Sarabun', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    font-size: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  /* ── Top bar ────────────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    flex-shrink: 0;
    z-index: 1;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .topbar .dot {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--brand);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }
  .topbar .title-wrap {
    line-height: 1.2;
  }
  .topbar .title {
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
  }
  .topbar .subtitle {
    font-size: 11px;
    color: var(--ink-3);
  }
  .topbar .server-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    flex-shrink: 0;
    font-size: 12px;
    color: var(--ink-3);
  }
  .topbar input.server-url {
    width: 240px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--bg);
    font-family: 'Menlo', monospace;
    outline: none;
    transition: border-color 120ms, background 120ms;
  }
  .topbar input.server-url:focus {
    border-color: var(--brand);
    background: #fff;
  }
  .topbar button, .topbar a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: background 120ms, border-color 120ms, color 120ms;
  }
  .topbar button:hover, .topbar a:hover {
    border-color: var(--brand);
    color: var(--brand);
    background: var(--brand-100);
  }
  /* ── Frame ──────────────────────────────────────────────── */
  .frame-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  iframe.preview {
    width: 100%;
    height: 100%;
    border: none;
    background: var(--surface);
  }
  .topbar-hint {
    font-size: 11px;
    color: var(--ink-3);
    margin-left: 4px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot">M</span>
    <div class="title-wrap">
      <div class="title">MIH Components</div>
      <div class="subtitle">Live catalog · 118 components</div>
    </div>
  </div>
  <span class="topbar-hint">↳ ใช้ sidebar + search ใน iframe ด้านล่าง</span>
  <div class="server-bar">
    <span>Server:</span>
    <input id="server-url" class="server-url" type="text" value="http://127.0.0.1:3000" />
    <button id="server-save" type="button">บันทึก</button>
    <button id="reload-btn" type="button">↻ Reload</button>
    <a id="open-new" href="http://127.0.0.1:3000/components" target="_blank" rel="noopener">↗ แท็บใหม่</a>
  </div>
</div>

<div class="frame-wrap">
  <iframe id="frame" class="preview" src="http://127.0.0.1:3000/components" loading="eager"></iframe>
</div>

<script>
  const STORAGE_KEY = 'mih-components-server-url';
  const serverInput = document.getElementById('server-url');
  const serverSave  = document.getElementById('server-save');
  const reloadBtn   = document.getElementById('reload-btn');
  const openNew     = document.getElementById('open-new');
  const frame       = document.getElementById('frame');

  function normUrl(u) { return (u || 'http://127.0.0.1:3000').replace(/\/+$/, ''); }

  function targetUrl() {
    const hash = window.location.hash.slice(1);
    const path = hash ? '/components/' + hash : '/components';
    return normUrl(serverInput.value) + path;
  }

  function applyServer() {
    const url = targetUrl();
    frame.src = url;
    openNew.href = url;
  }

  /* Restore saved server URL */
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) serverInput.value = saved;
  } catch (_) {}

  serverSave.addEventListener('click', () => {
    try { localStorage.setItem(STORAGE_KEY, serverInput.value); } catch (_) {}
    applyServer();
  });

  reloadBtn.addEventListener('click', () => {
    /* Re-assign src to force reload (handles SPA + cross-origin) */
    frame.src = frame.src;
  });

  /* React to hash changes so shareable links like
     COMPONENTS.html#brand-button still deep-link into a component. */
  window.addEventListener('hashchange', applyServer);

  /* Initial load — use whichever src the input ends up with */
  applyServer();
</script>
</body>
</html>
