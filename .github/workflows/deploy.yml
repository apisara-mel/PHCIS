name: Deploy to production

# Publish ขึ้น UAT (https://bma-health.mih.co.th) เฉพาะเมื่อสั่งเองเท่านั้น —
# merge เข้า main ไม่ trigger workflow นี้อีกต่อไป เพื่อให้ทีมรวมโค้ดบน main ได้
# โดยที่หน้าเว็บจริง (มีคนอื่นดูอยู่) ยังไม่เปลี่ยนจนกว่าจะ publish
#
# วิธี publish:
#   gh workflow run "Deploy to production" --ref main
#   หรือ GitHub → Actions → Deploy to production → Run workflow (branch: main)
#
# หลัง Actions สำเร็จ office-202 ดึง artifact dist-<sha> ไปเสิร์ฟผ่าน Cloudflare
# Tunnel (ปกติ ~3–5 นาที) ส่วน rsync ตรงขึ้นเซิร์ฟเวอร์ทำก็ต่อเมื่อตั้ง DEPLOY_*
# ครบเท่านั้น — ถ้ายังไม่ได้ตั้งจะ "ข้าม" ไม่ fail
#
# ถ้าอยากให้ rsync ตรงขึ้นเซิร์ฟเวอร์ ตั้งค่าเพิ่มใน repo settings:
#
#   Secrets (Settings → Secrets and variables → Actions → Secrets)
#     DEPLOY_SSH_KEY         private key ที่ public half อยู่ใน ~/.ssh/authorized_keys บนเซิร์ฟเวอร์
#
#   Variables (แท็บ Variables ข้าง ๆ กัน)
#     DEPLOY_HOST            host หรือ IP ที่ GitHub runner ต่อถึง (ไม่ใช่ชื่อที่ผ่าน Cloudflare)
#     DEPLOY_USER            ชื่อ user ที่ ssh เข้า
#     DEPLOY_PATH            web root ที่ nginx เสิร์ฟ เช่น /var/www/bma-health
#     DEPLOY_PORT            ssh port (ไม่ใส่ = 22)
#     DEPLOY_URL             URL สำหรับตรวจหลัง deploy (ไม่ใส่ = https://bma-health.mih.co.th)
#     DEPLOY_RSYNC_DELETE    ใส่ 'true' ถ้าต้องการลบไฟล์ส่วนเกินบนเซิร์ฟเวอร์ (ดู note ที่ step rsync)

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'เหตุผล/หมายเหตุ (optional) — แสดงใน Actions summary'
        required: false
        type: string

permissions:
  contents: read

# กัน publish ซ้อนกัน — ไม่ cancel ตัวที่กำลังวิ่ง เพราะ rsync/artifact ที่ค้างกลางทาง
# จะทิ้ง web root ไว้ครึ่ง ๆ
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout bma.health
        uses: actions/checkout@v4

      - name: บันทึกว่าเป็น manual publish
        run: |
          {
            echo "### Manual publish → UAT"
            echo ""
            echo "- **ref:** \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`"
            echo "- **ผู้สั่ง:** \`${{ github.actor }}\`"
            if [ -n "${{ github.event.inputs.note }}" ]; then
              echo "- **หมายเหตุ:** ${{ github.event.inputs.note }}"
            fi
            echo ""
            echo "merge เข้า \`main\` ไม่ trigger workflow นี้ — รอบนี้สั่ง publish เอง"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: vite build
        run: npm run build

      - name: ตรวจว่า build ออกมามีของจริง
        run: |
          test -f dist/index.html || { echo "::error::ไม่มี dist/index.html — build ไม่สำเร็จ"; exit 1; }
          ls dist/assets/index.*.js >/dev/null || { echo "::error::ไม่มี dist/assets/index.*.js"; exit 1; }
          echo "bundle: $(basename dist/assets/index.*.js)"
          du -sh dist

      # อัปโหลดเสมอ ไม่ว่าจะ rsync ต่อได้หรือไม่ — นี่คือช่องทางที่ office-202
      # ใช้ดึง build ไป publish เอง (ดึงผ่าน gh run download / GitHub API)
      - name: อัปโหลด dist เป็น artifact ให้ office-202 มาดึง
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # แยก config check ออกมาเพื่อให้เห็นในหน้า summary ว่า "ข้าม" เพราะอะไร
      - name: เช็คว่าตั้งค่า rsync ครบไหม
        id: cfg
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          MISSING=""
          [ -n "$DEPLOY_HOST" ]    || MISSING="$MISSING DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ]    || MISSING="$MISSING DEPLOY_USER"
          [ -n "$DEPLOY_PATH" ]    || MISSING="$MISSING DEPLOY_PATH"
          [ -n "$DEPLOY_SSH_KEY" ] || MISSING="$MISSING DEPLOY_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ข้ามขั้นตอน rsync — ยังไม่ได้ตั้ง:$MISSING · ใช้ artifact dist-${{ github.sha }} แทนได้เลย"
            {
              echo "### ข้าม rsync ขึ้นเซิร์ฟเวอร์"
              echo ""
              echo "ยังไม่ได้ตั้ง:$MISSING"
              echo ""
              echo "ดึง build ไป publish เองด้วย:"
              echo ''
              echo '```sh'
              echo "gh workflow run \"Deploy to production\" --ref main"
              echo "gh run download ${{ github.run_id }} -R ${{ github.repository }} -n dist-${{ github.sha }} -D dist"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: เตรียม SSH key และ known_hosts
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "::error::ssh-keyscan ไม่เจอ host key — เช็ค DEPLOY_HOST/DEPLOY_PORT และ firewall ว่าเปิดให้ GitHub runner เข้าไหม (เครื่องหลัง Cloudflare Tunnel จะเข้าไม่ได้ ให้ใช้ artifact แทน)"; exit 1; }

      # --delete ปิดไว้เป็นค่าเริ่มต้นโดยตั้งใจ: ถ้า DEPLOY_PATH ตั้งผิด มันจะลบของบน
      # เซิร์ฟเวอร์ทิ้ง และการเก็บ asset hash เก่าไว้ยังช่วยคนที่เปิดหน้าเว็บค้างอยู่
      # ไม่ให้ chunk หายกลางทาง เปิดใช้เมื่อมั่นใจ path แล้วด้วย var DEPLOY_RSYNC_DELETE=true
      - name: rsync dist/ ขึ้นเซิร์ฟเวอร์
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          RSYNC_DELETE: ${{ vars.DEPLOY_RSYNC_DELETE }}
        run: |
          DELETE_FLAG=""
          if [ "$RSYNC_DELETE" = "true" ]; then DELETE_FLAG="--delete"; fi
          rsync -rlptvz $DELETE_FLAG \
            -e "ssh -p ${DEPLOY_PORT:-22} -o StrictHostKeyChecking=yes" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # ยืนยันว่าเว็บเสิร์ฟ bundle ตัวใหม่จริง ไม่ใช่แค่ rsync ผ่านแล้วจบ
      # (เคสที่เจอมา: nginx ชี้ไปคนละ path หรือ Cloudflare cache HTML ค้าง)
      - name: ตรวจว่าเว็บเสิร์ฟ bundle ตัวใหม่แล้ว
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          URL="${DEPLOY_URL:-https://bma-health.mih.co.th}"
          EXPECTED="$(basename dist/assets/index.*.js)"
          echo "คาดว่าจะเจอ: $EXPECTED"
          for i in 1 2 3 4 5 6; do
            LIVE="$(curl -fsSL --max-time 30 "$URL" | grep -oE 'index\.[a-f0-9]+\.js' | head -1 || true)"
            echo "  ครั้งที่ $i: เว็บเสิร์ฟ ${LIVE:-<ไม่เจอ>}"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "✅ deploy สำเร็จ — เว็บเสิร์ฟ $EXPECTED"
              exit 0
            fi
            sleep 10
          done
          echo "::error::ไฟล์อัปโหลดขึ้นไปแล้วแต่เว็บยังเสิร์ฟ bundle เก่า — เช็ค nginx root ว่าตรงกับ DEPLOY_PATH ไหม หรือ purge Cloudflare cache"
          exit 1
